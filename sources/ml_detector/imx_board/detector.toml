[default]
socket_path = "/tmp/imx_ddb.socket"
inference_interval = 10.0
packet_timeout = 10
ipc_timeout = 0.1
max_batch_size = 100

[models.lucid_cnn]
path = "model/LUCID-ddos-CIC2019-quant-int8.tflite"
input_shape = [-1, 10, 11, 1]

[models.simple_dnn]
path = "model/simple-dnn-quant-int8.tflite"
input_shape = [-1, 110]
